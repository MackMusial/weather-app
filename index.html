<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1b3a" />
  <title>Weather App</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="bg-blob bg-blob-1"></span>
    <span class="bg-blob bg-blob-2"></span>
    <span class="bg-blob bg-blob-3"></span>
    <div class="precip" id="precip"></div>
  </div>

  <header class="app-header">
    <div class="title-row">
      <div class="title-left">
        <h1>Weather App</h1>
        <p id="location" class="location">Locating…</p>
      </div>

      <div class="title-right">
        <div id="air" class="air" hidden title="US Air Quality Index">
          <span id="air-value" class="air-value">–</span>
          <span id="air-word" class="air-word"></span>
          <div class="air-bar"><span id="air-marker" class="air-marker"></span></div>
        </div>

        <button id="settings-btn" class="icon-btn" type="button"
          aria-label="Settings" aria-expanded="false" aria-controls="settings-panel">⚙️</button>
      </div>
    </div>

    <div id="settings-panel" class="settings-panel" hidden>
      <label class="settings-label" for="cal-input">Public Google Calendar</label>
      <form id="cal-form" class="cal-form">
        <input id="cal-input" type="text" list="cal-history" autocomplete="off" spellcheck="false"
          placeholder="Calendar email or ID…" aria-label="Public Google Calendar" />
        <datalist id="cal-history"></datalist>
        <button class="btn" type="submit">Load</button>
      </form>
      <p class="settings-hint">Shows a public calendar's events beside the weather — no sign-in. Recent entries are remembered.</p>
    </div>

    <div class="controls">
      <form id="city-form" class="city-form">
        <input id="city-input" type="text" placeholder="City, state/country… (e.g. Woodhaven MI)" autocomplete="off" />
        <button class="btn" type="submit">Go</button>
        <button id="geo-btn" class="btn btn-ghost" type="button" title="Use my location">📍</button>
      </form>

      <div id="unit-toggle" class="unit-toggle" data-unit="celsius" role="group" aria-label="Temperature unit">
        <span class="unit-thumb" aria-hidden="true"></span>
        <button class="unit-opt" type="button" data-unit="celsius">°C</button>
        <button class="unit-opt" type="button" data-unit="fahrenheit">°F</button>
      </div>

      <div class="date-nav">
        <button id="prev-day" class="btn btn-ghost" type="button" aria-label="Back one day">‹</button>
        <span id="date-label">Now</span>
        <button id="next-day" class="btn btn-ghost" type="button" aria-label="Forward one day">›</button>
      </div>
    </div>

    <p id="status" class="status" role="status"></p>
    <div id="allday" class="allday" hidden></div>
  </header>

  <main>
    <div class="grid-head">
      <span>Time</span>
      <span>Weather</span>
      <span>Calendar <small id="cal-name" class="cal-name"></small></span>
    </div>
    <ol id="rows" class="rows"></ol>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
